  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

.form-range::-webkit-slider-runnable-track {
  height: 28px;

}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

}

          tables:[&#x27;SanPham&#x27;,&#x27;NhaCungCap&#x27;,&#x27;PhieuHuyHang&#x27;,&#x27;PhieuNhapKho&#x27;,&#x27;ChiTietHuy&#x27;,&#x27;KhoHang&#x27;,&#x27;HangHuTrongKho&#x27;]
        },
        returns: {
          label:&#x27;Đổi trả&#x27;, x:420, y:240, width:1350, height:1200, zoom:0.70,
          tables:[&#x27;DonHang&#x27;,&#x27;ChiTietDH&#x27;,&#x27;SanPham&#x27;,&#x27;PhieuDoiTra&#x27;,&#x27;ChiTietDT&#x27;]
        }
      };
      let currentModule = &#x27;sales&#x27;;
      let currentSize = moduleViews.sales;

      const tableMap = new Map(tables.map(table =&gt; [table.name, table]));
      const el = (name, attrs = {}) =&gt; {
        const node = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
        return node;
      };
      const heightOf = table =&gt; headerHeight + table.fields.length * rowHeight;

      const defs = el(&#x27;defs&#x27;);
      const crow = el(&#x27;marker&#x27;, {id:&#x27;erd-crow&#x27;, viewBox:&#x27;0 0 12 12&#x27;, refX:&#x27;11&#x27;, refY:&#x27;6&#x27;, markerWidth:&#x27;8&#x27;, markerHeight:&#x27;8&#x27;, orient:&#x27;auto&#x27;});
      crow.appendChild(el(&#x27;path&#x27;, {d:&#x27;M1,1 L11,6 L1,11 M11,6 L1,6&#x27;, fill:&#x27;none&#x27;, stroke:&#x27;#c93c3c&#x27;, &#x27;stroke-width&#x27;:&#x27;1.4&#x27;}));
      defs.appendChild(crow);
      const one = el(&#x27;marker&#x27;, {id:&#x27;erd-one&#x27;, viewBox:&#x27;0 0 12 12&#x27;, refX:&#x27;10&#x27;, refY:&#x27;6&#x27;, markerWidth:&#x27;8&#x27;, markerHeight:&#x27;8&#x27;, orient:&#x27;auto&#x27;});
      one.appendChild(el(&#x27;path&#x27;, {d:&#x27;M8,1 L8,11 M4,1 L4,11&#x27;, fill:&#x27;none&#x27;, stroke:&#x27;#c93c3c&#x27;, &#x27;stroke-width&#x27;:&#x27;1.4&#x27;}));
      defs.appendChild(one);
      svg.appendChild(defs);

      const keyRowY = (table, expression) =&gt; {
        const names = expression.replace(/[()]/g, &#x27;&#x27;).split(&#x27;,&#x27;).map(name =&gt; name.trim());
        const indexes = names.map(name =&gt; table.fields.findIndex(field =&gt; field[0] === name)).filter(index =&gt; index &gt;= 0);
        const average = indexes.length ? indexes.reduce((sum, index) =&gt; sum + index, 0) / indexes.length : 0;
        return table.y + headerHeight + average * rowHeight + rowHeight / 2;
      };

      const routeRelation = (from, to, rel, index) =&gt; {
        const fromCenterX = from.x + width / 2;
        const toCenterX = to.x + width / 2;
        const fromHeight = heightOf(from);
        const toHeight = heightOf(to);
        if (Math.abs(from.x - to.x) &lt; 2) {
          const downward = to.y &gt; from.y;
          const a = {x:fromCenterX, y:downward ? from.y + fromHeight : from.y};
          const b = {x:toCenterX, y:downward ? to.y : to.y + toHeight};
          return {d:`M ${a.x} ${a.y} V ${b.y}`, a, b};
        }
        const rightward = toCenterX &gt; fromCenterX;
        const a = {x:rightward ? from.x + width : from.x, y:keyRowY(from, rel.pk)};
        const b = {x:rightward ? to.x : to.x + width, y:keyRowY(to, rel.fk)};
        const offset = ((index % 5) - 2) * 9;
        const channelX = (a.x + b.x) / 2 + offset;
        return {d:`M ${a.x} ${a.y} H ${channelX} V ${b.y} H ${b.x}`, a, b};

      const cardinalityPosition = (point, table) =&gt; {
        if (point.x &lt;= table.x + 1) return {x:point.x - 8, y:point.y - 5, anchor:&#x27;end&#x27;};
        if (point.x &gt;= table.x + width - 1) return {x:point.x + 8, y:point.y - 5, anchor:&#x27;start&#x27;};
        const above = point.y &lt;= table.y + 1;
        return {x:point.x + 8, y:above ? point.y - 6 : point.y + 15, anchor:&#x27;start&#x27;};
      };

      const edgeLayer = el(&#x27;g&#x27;);
      relations.forEach((rel, index) =&gt; {
        const from = tableMap.get(rel.p);
        const to = tableMap.get(rel.c);
        const route = routeRelation(from, to, rel, index);
        const path = el(&#x27;path&#x27;, {
          d:route.d,
          class:&#x27;erd-edge&#x27;,
          &#x27;data-parent&#x27;:rel.p,

        const title = el(&#x27;title&#x27;);

        const parentPosition = cardinalityPosition(route.a, from);
        const parentLabel = el(&#x27;text&#x27;, {x:parentPosition.x, y:parentPosition.y, &#x27;text-anchor&#x27;:parentPosition.anchor, class:&#x27;erd-cardinality&#x27;, &#x27;data-parent&#x27;:rel.p, &#x27;data-child&#x27;:rel.c});
        parentLabel.textContent = &#x27;1&#x27;;
        edgeLayer.appendChild(parentLabel);

        const childPosition = cardinalityPosition(route.b, to);
        const childLabel = el(&#x27;text&#x27;, {x:childPosition.x, y:childPosition.y, &#x27;text-anchor&#x27;:childPosition.anchor, class:&#x27;erd-cardinality&#x27;, &#x27;data-parent&#x27;:rel.p, &#x27;data-child&#x27;:rel.c});
        childLabel.textContent = rel.card === &#x27;1:1&#x27; ? &#x27;1&#x27; : &#x27;N&#x27;;

      svg.appendChild(edgeLayer);

      const nodeLayer = el(&#x27;g&#x27;);
      tables.forEach(table =&gt; {

        const group = el(&#x27;g&#x27;, {class:&#x27;erd-node&#x27;, transform:`translate(${table.x} ${table.y})`, tabindex:&#x27;0&#x27;, role:&#x27;button&#x27;, &#x27;aria-label&#x27;:table.name, &#x27;data-table&#x27;:table.name});

        group.appendChild(el(&#x27;rect&#x27;, {x:0,y:0,width,height:headerHeight,rx:0,class:&#x27;table-header&#x27;}));
        const title = el(&#x27;text&#x27;, {x:width/2,y:22,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;table-name&#x27;});
        title.textContent = table.name;
        group.appendChild(title);
        table.fields.forEach((field, index) =&gt; {
          const y = headerHeight + index * rowHeight;
          const line = el(&#x27;text&#x27;, {x:8,y:y+15,class:&#x27;field-line&#x27;});
          line.textContent = `${field[0]} : ${field[1]}${field[2] ? ` (${field[2]})` : &#x27;&#x27;}`;
          group.appendChild(line);
        });
        const tooltip = el(&#x27;title&#x27;);
        tooltip.textContent = `${table.name}(${table.fields.map(field =&gt; `${field[0]} ${field[1]}${field[2] ? ` ${field[2]}` : &#x27;&#x27;}`).join(&#x27;, &#x27;)})`;
        group.appendChild(tooltip);
        group.addEventListener(&#x27;click&#x27;, event =&gt; {
          event.stopPropagation();

        group.addEventListener(&#x27;keydown&#x27;, event =&gt; {
          if (event.key === &#x27;Enter&#x27; || event.key === &#x27; &#x27;) {

        nodeLayer.appendChild(group);
      });
      svg.appendChild(nodeLayer);

      const formatField = field =&gt; {
        const key = field[2] ? ` &lt;span class=&quot;${field[2].includes(&#x27;PK&#x27;) ? &#x27;key-pk&#x27; : &#x27;key-fk&#x27;}&quot;&gt;(${field[2]})&lt;/span&gt;` : &#x27;&#x27;;
        return `${field[0]} ${field[1]}${key}`;
      };
      definitions.innerHTML = tables.map(table =&gt; `&lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;${table.name}&lt;/strong&gt;(${table.fields.map(formatField).join(&#x27;, &#x27;)})&lt;/div&gt;`).join(&#x27;&#x27;);
      relationships.innerHTML = relations.map((rel, index) =&gt; `&lt;div class=&quot;relationship&quot;&gt;${index + 1}. ${rel.p} (1) — (${rel.card.endsWith(&#x27;N&#x27;) ? &#x27;N&#x27; : &#x27;1&#x27;}) ${rel.c}: ${rel.pk} — ${rel.fk}&lt;/div&gt;`).join(&#x27;&#x27;);
      manyToManyList.innerHTML = manyToMany.map((rel, index) =&gt; `&lt;div class=&quot;relationship&quot;&gt;${index + 1}. ${rel.a} (N) — (N) ${rel.b}, qua bảng ${rel.via}&lt;/div&gt;`).join(&#x27;&#x27;);

      const selectTable = name =&gt; {
        selected = selected === name ? null : name;
        const related = new Set([selected]);
        relations.forEach(rel =&gt; {
          if (rel.p === selected) related.add(rel.c);
          if (rel.c === selected) related.add(rel.p);

        root.querySelectorAll(&#x27;.erd-node&#x27;).forEach(node =&gt; {

      const applyZoom = () =&gt; {

        root.querySelectorAll(&#x27;.erd-edge, .erd-cardinality&#x27;).forEach(item =&gt; {
          const show = visible.has(item.getAttribute(&#x27;data-parent&#x27;)) &amp;&amp; visible.has(item.getAttribute(&#x27;data-child&#x27;));
          item.style.display = show ? &#x27;&#x27; : &#x27;none&#x27;;

        root.querySelectorAll(&#x27;[data-module]&#x27;).forEach(button =&gt; {
          button.setAttribute(&#x27;aria-selected&#x27;, String(button.getAttribute(&#x27;data-module&#x27;) === moduleName));

        zoom = currentSize.zoom;
        applyZoom();
        viewport.scrollLeft = 0;
        viewport.scrollTop = 0;
        selection.textContent = `${currentSize.label}: ${visible.size} bảng`; 
      };
      root.querySelectorAll(&#x27;[data-module]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; applyModule(button.getAttribute(&#x27;data-module&#x27;)));
      });
      applyModule(&#x27;sales&#x27;);

      root.querySelectorAll(&#x27;[data-zoom]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const action = button.getAttribute(&#x27;data-zoom&#x27;);
          if (action === &#x27;in&#x27;) zoom = Math.min(1.2, zoom + 0.12);
          if (action === &#x27;out&#x27;) zoom = Math.max(0.28, zoom - 0.12);
          if (action === &#x27;reset&#x27;) zoom = currentSize.zoom;
          applyZoom();
        });
      });

      root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const tab = button.getAttribute(&#x27;data-tab&#x27;);
          root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === button)));

          listPanel.hidden = tab !== &#x27;list&#x27;;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
